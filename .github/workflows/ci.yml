name: CI

on: 
  push:
  pull_request: 

jobs:
  test:
      runs-on: ubuntu-latest

      steps:
        - name: Check out repo
        uses: actions/checkoutv4

      - name: Setup python
      uses: actions/setup-pythonv5
      with:
        pyhton-version: "3.11"

      - name: Run requirements
        run: pip install -r requirements.txt

      - name: Run tests and coverage
        run: python -m pytest python -m pytest --cov=app --cov-report=term-missing